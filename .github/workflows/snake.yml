`name: Generate Snake Animation

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mdenogueira
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#A78BFA&color_dots=#F4F4F4,#DDD6FE,#C4B5FD,#A78BFA,#A78BFA
            dist/github-contribution-grid-snake-dark.svg?color_snake=#C4B5FD&color_dots=#0D1117,#2A163D,#4C1D95,#7C3AED,#C4B5FD

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}`
