`name: Generate Snake Animation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mdenogueira
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7C3AED&color_dots=#F4F4F4,#DCDCDC,#B8B8B8,#888888,#7C3AED
            dist/github-contribution-grid-snake-dark.svg?color_snake=#A78BFA&color_dots=#0D1117,#22262D,#41464D,#7D8590,#A78BFA

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}`
