`name: Generate Snake Animation

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mdenogueira
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23A855F7&color_dots=%23F3E8FF,%23E9D5FF,%23D8B4FE,%23C084FC,%239333EA
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23A855F7&color_dots=%230D1117,%232E1065,%234C1D95,%236D28D9,%23A855F7
      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}`
